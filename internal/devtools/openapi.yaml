# OpenAPI spec for the REST surface. GraphQL lives at /graphql (see the
# playground). Keep this in sync with the routes registered in
# internal/app/app.go — TestOpenAPISpecMatchesRoutes enforces it in CI.
openapi: "3.0.3"

info:
  title: LiteEnd-Go API
  version: "0.0.1"
  description: REST endpoints. GraphQL is at /graphql.

paths:
  /livez:
    get:
      summary: Liveness probe — the process is running; no dependency is checked
      responses:
        "200": { description: Alive }

  /readyz:
    get:
      summary: Readiness probe — database and Redis decide it; the heap only rides along
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }

  /health:
    get:
      summary: Alias of /readyz, kept for deployments that already poll it
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }

  /upload:
    post:
      summary: Upload image files
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201": { description: Files uploaded }
        "400": { description: Bad request }
        "401": { description: Unauthorized }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
