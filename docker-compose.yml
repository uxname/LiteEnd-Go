x-common-logging: &common-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-common-restart-policy: &common-restart-policy
  restart: unless-stopped

# Resource limits cap each container so a leak or runaway in one service cannot
# exhaust host CPU/memory and take down the others. Honored by `docker compose
# up` (Compose v2). Tune to the target host.
x-app-resources: &app-resources
  resources:
    limits:
      cpus: "1.5"
      memory: 512M
x-db-resources: &db-resources
  resources:
    limits:
      cpus: "2.0"
      memory: 1G
x-small-resources: &small-resources
  resources:
    limits:
      cpus: "0.5"
      memory: 256M

services:
  app:
    # `up` reuses whatever image last claimed this tag — run `up --build` (or
    # `task docker:build` first) after code changes.
    image: "${IMAGE_REGISTRY:-}liteend:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: Dockerfile
    <<: *common-restart-policy
    deploy:
      <<: *app-resources
    # Config reaches the container two ways — pick per machine:
    #   1. a .env NEXT TO THIS FILE (the usual local flow): loaded when present;
    #   2. plain exported environment variables (no-.env machines): the explicit
    #      mappings below pick them up via interpolation.
    # Interpolation reads shell vars first, then the project-dir .env, so both
    # sources feed the same ${VAR}. Only the keys listed below enter the
    # container — the same rule docker-compose.prod.yml follows.
    env_file:
      - path: .env
        required: false
    environment:
      # Service names override the configured addresses, which point at the host
      # for an app started outside docker (`task start:dev`). S3_ENDPOINT is the
      # storage address INSIDE this network; S3_PUBLIC_BASE_URL is left alone,
      # because that one is resolved by the browser.
      DATABASE_HOST: db
      REDIS_HOST: redis
      S3_ENDPOINT: http://garage:3900
      # ":?" marks every variable internal/config declares `required` (plus
      # CORS_ORIGIN, as in the prod file): a half-configured machine fails at
      # `docker compose config` naming the variable, instead of crash-looping
      # the container at boot. Everything else repeats internal/config's own
      # default, so the two cannot drift — with two deliberate exceptions for
      # this stand: REDIS_PASSWORD (the app defaults to none, but an empty one
      # would swallow the next argument of redis-server's command line below)
      # and OIDC_MOCK_ENABLED (a local stack has no OIDC provider to talk to).
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set OIDC_AUDIENCE}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?set OIDC_JWKS_URI}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?set S3_PUBLIC_BASE_URL (public link prefix the browser resolves)}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN (comma-separated origins, must include the frontend one)}
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-postgres}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      FILE_VISIBILITY: ${FILE_VISIBILITY:-private}
      FILE_LINK_TTL_MINUTES: ${FILE_LINK_TTL_MINUTES:-60}
      OIDC_MOCK_ENABLED: ${OIDC_MOCK_ENABLED:-true}
      # Host ports of the dashboards — rendered as links on /dev.
      DB_STUDIO_PORT: ${DB_STUDIO_PORT:-5100}
      REDIS_STUDIO_PORT: ${REDIS_STUDIO_PORT:-5200}
      ASYNQMON_PORT: ${ASYNQMON_PORT:-5300}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:${PORT:-4000}:${PORT:-4000}"
    networks:
      - liteend-net
    logging: *common-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    # No healthcheck here on purpose: the app's HEALTHCHECK lives in the
    # Dockerfile — one source of truth, honored by plain `docker run` too.

  db:
    image: postgres:18.1-alpine
    <<: *common-restart-policy
    deploy:
      <<: *db-resources
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-postgres}
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:${DATABASE_PORT:-5432}"
    command: -p ${DATABASE_PORT:-5432}
    networks:
      - liteend-net
    logging: *common-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-postgres} -p ${DATABASE_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    <<: *common-restart-policy
    deploy:
      <<: *small-resources
    command: >
      redis-server --save 20 1 --loglevel warning
      --requirepass ${REDIS_PASSWORD:-redis} --port ${REDIS_PORT:-6379}
    volumes:
      - redis:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    networks:
      - liteend-net
    logging: *common-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "${REDIS_PORT:-6379}", "-a", "${REDIS_PASSWORD:-redis}", "--raw", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for uploaded files. Every replica of the app
  # writes here, so a file stored by one is readable through all of them.
  garage:
    image: dxflrs/garage:v2.1.0
    <<: *common-restart-policy
    deploy:
      <<: *db-resources
    environment:
      # Shared secret between the node and the CLI in garage-init. Fake by
      # design — this stack is loopback-only; generate a real one for anything
      # else with `openssl rand -hex 32`.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
    configs:
      - source: garage
        target: /etc/garage.toml
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      # 3900 = S3 API, the S3_ENDPOINT of an app started outside docker;
      # 3902 = web endpoint, where the public file links are served from.
      # Both ports also appear in .env.example — change them together.
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3902:3902"
    networks:
      - liteend-net
    logging: *common-logging
    healthcheck:
      # The image is FROM scratch — no shell, so an exec-form check calling the
      # garage binary itself is all there is.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot initializer: a fresh Garage has no layout, no access key and no
  # bucket, and `docker compose up` must not need manual commands. The garage
  # image carries no shell to script that with, so this runs alpine with the
  # garage binary mounted straight out of that image (needs Docker Engine 27.4+
  # for `type: image` mounts). Every step is skipped when it is already there,
  # so a restart or an `up` on an existing volume is a no-op.
  garage-init:
    image: alpine:3.21
    restart: "no"
    deploy:
      <<: *small-resources
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?set S3_PUBLIC_BASE_URL (public link prefix the browser resolves)}
      FILE_VISIBILITY: ${FILE_VISIBILITY:-private}
    configs:
      - source: garage
        target: /etc/garage.toml
    volumes:
      - type: image
        source: dxflrs/garage:v2.1.0
        target: /garage-image
      # Read-only: the CLI only needs this node's public key from here to
      # address the node over RPC.
      - garage-meta:/var/lib/garage/meta:ro
    networks:
      - liteend-net
    logging: *common-logging
    depends_on:
      garage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-euc"]
    # One list item = one argument = the whole script. "$$" is an escaped "$":
    # compose interpolates this string before the shell ever sees it.
    command:
      - |
        : "$${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the environment or .env (see .env.example)}"
        : "$${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the environment or .env (see .env.example)}"
        : "$${S3_PUBLIC_BASE_URL:?set S3_PUBLIC_BASE_URL in the environment or .env (see .env.example)}"
        garage() { /garage-image/garage "$$@"; }

        # Layout: give the single node a role, then commit version 1 — the
        # first and only layout this cluster ever gets.
        if garage status | grep -q "NO ROLE ASSIGNED"; then
          garage layout assign -z dc1 -c 10G "$$(garage node id -q | cut -d@ -f1)"
          garage layout apply --version 1
        fi

        # The app authenticates with the configured key pair, so import that
        # exact pair instead of creating a random one nobody configured.
        garage key info "$$S3_ACCESS_KEY_ID" >/dev/null 2>&1 ||
          garage key import --yes -n liteend "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        garage bucket info "$$S3_BUCKET" >/dev/null 2>&1 || garage bucket create "$$S3_BUCKET"
        garage bucket allow --read --write "$$S3_BUCKET" --key "$$S3_ACCESS_KEY_ID"

        # Anonymous read, and only when FILE_VISIBILITY says so. Garage refuses
        # anonymous requests on the S3 API outright ("Garage does not support
        # anonymous access yet"), so public links are served by the web endpoint,
        # which picks the bucket from the Host header — hence the alias on the
        # host of S3_PUBLIC_BASE_URL, derived from it here rather than kept in a
        # second variable that could drift.
        #
        # In the default private mode the door stays shut: no website, no alias,
        # and the app hands out signed S3-API links instead. This runs on every
        # `up`, so flipping the variable and bringing the stack up again is all
        # it takes to open or close the bucket.
        if [ "$${FILE_VISIBILITY:-private}" = "public" ]; then
          garage bucket website --allow "$$S3_BUCKET"
          web_host=$$(echo "$$S3_PUBLIC_BASE_URL" | sed -e 's|^[a-zA-Z][a-zA-Z0-9+.-]*://||' -e 's|[:/].*$$||')
          [ "$$web_host" = "$$S3_BUCKET" ] || garage bucket alias "$$S3_BUCKET" "$$web_host"
          echo "garage ready: bucket $$S3_BUCKET served publicly as host $$web_host"
        else
          garage bucket website --deny "$$S3_BUCKET"
          echo "garage ready: bucket $$S3_BUCKET is private — files are served through signed links only"
        fi

  # ---- Admin dashboards (internal only; exposed via the auth proxy below) ----

  # pgweb: DB browser (Prisma Studio analog).
  db_studio:
    image: sosedoff/pgweb:0.17.0
    <<: *common-restart-policy
    deploy:
      <<: *small-resources
    environment:
      DATABASE_URL: postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:?set DATABASE_PASSWORD}@db:${DATABASE_PORT:-5432}/${DATABASE_NAME:-postgres}?sslmode=disable
    networks:
      - liteend-net
    logging: *common-logging
    depends_on:
      db:
        condition: service_healthy

  # RedisInsight: official Redis GUI. RI_REDIS_* pre-configures the "liteend"
  # connection (visible after accepting the one-time EULA prompt).
  redis_studio:
    image: redis/redisinsight:3.8.0
    <<: *common-restart-policy
    deploy:
      <<: *small-resources
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: ${REDIS_PORT:-6379}
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      RI_REDIS_ALIAS: liteend
    networks:
      - liteend-net
    logging: *common-logging
    depends_on:
      redis:
        condition: service_healthy

  # Asynqmon: queue dashboard (Bull Board analog).
  asynqmon:
    image: hibiken/asynqmon:0.7.2
    <<: *common-restart-policy
    # Static Go binary that writes nothing — safe under any numeric non-root uid.
    user: "65532:65532"
    deploy:
      <<: *small-resources
    command:
      - "--redis-addr=redis:${REDIS_PORT:-6379}"
      - "--redis-password=${REDIS_PASSWORD:-redis}"
    networks:
      - liteend-net
    logging: *common-logging
    depends_on:
      redis:
        condition: service_healthy

  # Auth proxy: enforces HTTP Basic Auth in front of every admin dashboard, so
  # none of them is reachable anonymously. Backends publish no host ports.
  admin_proxy:
    image: caddy:2-alpine
    <<: *common-restart-policy
    # The caddy image runs as root by default; this is a plain HTTP basic-auth
    # proxy (no TLS cert storage), so run non-root and point Caddy's state dirs
    # at a writable /tmp path.
    user: "65532:65532"
    deploy:
      <<: *small-resources
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      # The dev-only fallback hash lives HERE, not in the Caddyfile: Caddy's own
      # `{$VAR:default}` fires only when the variable is UNSET, and compose
      # always sets every key it lists — so an unconfigured machine handed Caddy
      # an empty password and it refused to start. ":-" covers unset AND empty.
      # It is the bcrypt of "admin"; "$$" is an escaped "$" for compose.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-$$2a$$14$$HAt9aLO.T.57BDK8puAjf.H59sFkLvkqhxCtU4sZZgyHiJfHjJATW}
      XDG_CONFIG_HOME: /tmp/caddy/config
      XDG_DATA_HOME: /tmp/caddy/data
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${DB_STUDIO_PORT:-5100}:8081"
      - "127.0.0.1:${REDIS_STUDIO_PORT:-5200}:8082"
      - "127.0.0.1:${ASYNQMON_PORT:-5300}:8083"
    networks:
      - liteend-net
    logging: *common-logging
    depends_on:
      - db_studio
      - redis_studio
      - asynqmon

networks:
  liteend-net:
    driver: bridge

volumes:
  postgres: # Postgres data (internal; inspect via pgweb, not raw files)
  redis: # Redis data (internal; inspect via RedisInsight)
  garage-meta: # Garage cluster metadata and object index
  garage-data: # Garage object data (the uploaded files themselves)

# Inline so the whole dev stack stays in one file. Garage has no environment
# variables for these settings — only GARAGE_RPC_SECRET, which the services set.
configs:
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"
      # One node keeping one copy of every block: a dev stack, not a cluster.
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      # Where garage-init's CLI reaches this node.
      rpc_public_addr = "garage:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"

      [s3_web]
      # Public, unauthenticated reads of the uploaded files: the S3 API above
      # answers 403 to every anonymous request, so the browser is sent here.
      # The bucket is chosen by the Host header — either <bucket>.web.garage or,
      # as garage-init sets it up, the host of S3_PUBLIC_BASE_URL. root_domain
      # is not optional: Garage refuses to start without it.
      bind_addr = "[::]:3902"
      root_domain = ".web.garage"
      index = "index.html"
