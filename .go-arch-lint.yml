version: 3
workdir: .

# go-arch-lint here owns the INTERNAL layering only; third-party imports are left
# to golangci-lint (gosec etc.) and to `allow.depOnAnyVendor` below.
#
# How a package gets its layer — the rule this map is actually built on:
#   1. A package belongs to what it OWNS, not to what it exposes: `health` and
#      `i18n` are infrastructure even though they hand out http.Handlers, and
#      `auth`/`upload` are domain logic with their own HTTP wrapper next to it.
#   2. That HTTP wrapper stays inside its own package, not in `transport`.
#   3. A helper both transport and domain need is declared in commonComponents
#      below and never copied.
allow:
  depOnAnyVendor: true

# Unit and integration tests may reach across layers via helpers — exclude them
# so test scaffolding does not produce false architecture violations.
excludeFiles:
  - "_test\\.go$"

components:
  entrypoint:     { in: cmd/** }
  composition:    { in: internal/app }
  transport:
    in:
      - internal/server
      - internal/devtools
      - internal/graph
      - internal/graph/**     # generated, model, resolver
  # middleware is its own component, not part of transport: it must NOT reach into
  # internal/graph or internal/server, and inside transport it would be allowed to.
  middleware:     { in: internal/middleware }
  domain:
    in:
      - internal/auth
      - internal/profile
      - internal/upload
      - internal/queue
  infrastructure:
    in:
      - db                    # top-level embed package (migrations/queries assets)
      - internal/db
      - internal/db/**        # sqlc generated
      - internal/redis
      - internal/i18n
      - internal/health
  # cross-cutting helpers — importable by any layer
  config:  { in: internal/config }
  logger:  { in: internal/logger }
  version: { in: internal/version }
  httperr: { in: internal/httperr }

commonComponents:
  - config
  - logger
  - version
  - httperr

deps:
  entrypoint:
    mayDependOn: [composition, transport, domain, infrastructure]
  composition:
    mayDependOn: [transport, middleware, domain, infrastructure]
  transport:
    mayDependOn: [transport, middleware, domain, infrastructure]   # self: graph↔resolver; server→middleware
  middleware:
    mayDependOn: [domain, infrastructure]               # no transport: no graph, no server
  domain:
    mayDependOn: [domain, infrastructure]               # self: auth uses profile
  infrastructure:
    mayDependOn: [infrastructure]                       # self: internal/db → db, sqlc
