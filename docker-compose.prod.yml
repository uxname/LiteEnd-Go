# Production compose — the APP ONLY. Postgres, Redis and the object storage are
# NOT here: the production config points DATABASE_HOST/REDIS_HOST/S3_ENDPOINT at
# external services (Dokploy native services, managed databases, a Garage or
# MinIO of your own, or another compose project), given either by a .env next to
# this file OR by plain exported environment variables. Local dev uses
# docker-compose.yml instead — that one runs Postgres, Redis and a Garage with
# its own initializer. Full deploy guide: the meta repo's docs/DEPLOY.md.
#
# Runs in as many copies as asked for — `up -d --scale app=N`. Nothing here is
# per-copy state (no host port, no volume), so the copies differ by container
# name only. Two numbers to size before raising N: N x DB_POOL_MAX must stay
# under the database's connection limit, and TRUSTED_PROXY_HOPS must match the
# number of proxies actually in front of the app.
#
# Deliberately no build: block — this file is a deploy artifact. The image must
# already exist: pulled from a registry, or built first with `task docker:build`
# (same tag). With a build: fallback, a failed pull would silently ship a local
# rebuild under the pushed artifact's tag.

services:
  app:
    image: "${IMAGE_REGISTRY:-}liteend:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    # Config reaches the container two ways — pick per host:
    #   1. a .env NEXT TO THIS FILE (single-machine flow): loaded when present;
    #   2. plain exported environment variables (no-.env hosts): the explicit
    #      mappings below pick them up via interpolation.
    # Interpolation reads shell vars first, then the project-dir .env, so both
    # sources feed the same ${VAR}. Required-in-production vars use ":?" so a
    # half-configured host fails LOUDLY at compose time instead of booting an
    # app that cannot authenticate anything. Vars not listed here ride in only
    # via .env (optional tuning — see .env.example).
    env_file:
      - path: .env
        required: false
    environment:
      # Prod artifact: production posture unless overridden upstream.
      NODE_ENV: ${NODE_ENV:-production}
      # Empty CORS_ORIGIN allows every origin OUTSIDE production (the silent
      # wrong-environment trap) — refuse to render without an explicit list.
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN (comma-separated origins)}
      DATABASE_HOST: ${DATABASE_HOST:-localhost}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-postgres}
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set OIDC_AUDIENCE}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?set OIDC_JWKS_URI}
      # Uploaded files live in the object store, the only place every copy can
      # reach. S3_ENDPOINT is the storage address as the APP sees it (inside the
      # network); S3_PUBLIC_BASE_URL is the link prefix as the BROWSER sees it
      # from outside, so the two are never the same value.
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT (storage address reachable from the app)}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?set S3_PUBLIC_BASE_URL (public link prefix the browser resolves)}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      FILE_VISIBILITY: ${FILE_VISIBILITY:-private}
      FILE_LINK_TTL_MINUTES: ${FILE_LINK_TTL_MINUTES:-60}
      # Per-copy pool: N copies x this must stay under the database's limit.
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      # How many proxies sit in front; the client address is taken that many
      # entries from the right of X-Forwarded-For.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # The container ALWAYS listens on 4000 (mirrors the frontend prod compose).
      PORT: 4000
    # No published host port on purpose: every copy would fight for the same
    # one, so `up --scale app=N` could never start a second one. The reverse
    # proxy reaches port 4000 over the shared external network below and
    # load-balances across the copies by name.
    #
    # That name is `liteend`, not the service's own `app`: the frontend's prod
    # compose also names its service `app`, so on ONE shared proxy network the
    # bare `app` resolves to BOTH sides and a proxy asking for `app:4000` can be
    # handed the frontend container. The alias is per-side and unambiguous,
    # while still returning every copy of THIS side under `--scale app=N`.
    networks:
      proxy:
        aliases:
          - liteend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # No healthcheck here on purpose: the app's HEALTHCHECK lives in the
    # Dockerfile — one source of truth, honored by any orchestrator.

# The proxy network is created and joined by the reverse proxy (Caddy, Traefik,
# Dokploy's dokploy-network, …), not by this file — hence external. Its NAME is
# a variable so nothing here is tied to one hosting product; set PROXY_NETWORK
# to whatever the proxy on this host uses.
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-dokploy-network}
