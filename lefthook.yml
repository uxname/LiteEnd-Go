# Git hooks. The full project gate lives in the Taskfile so it runs the same
# way everywhere (locally, in any CI, by hand). On Arch Linux the runner is the
# `go-task` package — the snippet below uses whichever of `task` / `go-task`
# is on PATH.

pre-commit:
  commands:
    check:
      # Full check: codegen freshness, tidy, lint, arch, deadcode, secrets.
      run: sh -c 'if command -v task >/dev/null 2>&1; then task check; else go-task check; fi'

pre-push:
  commands:
    test:
      # All tests — unit + integration (testcontainers, needs Docker) — plus
      # the coverage threshold gate (.testcoverage.yml).
      run: sh -c 'if command -v task >/dev/null 2>&1; then task test:cov; else go-task test:cov; fi'
    secrets:
      # The history, which pre-commit cannot see: by now the outgoing commits are
      # local, so this catches a merge commit and anything made with --no-verify.
      run: sh -c 'if command -v task >/dev/null 2>&1; then task secrets:history; else go-task secrets:history; fi'
    vuln:
      # govulncheck — the only gate that needs the network, and the only one whose
      # verdict changes without the code changing. On a commit that is a surprise;
      # on a push it is the right moment.
      run: sh -c 'if command -v task >/dev/null 2>&1; then task vuln; else go-task vuln; fi'
