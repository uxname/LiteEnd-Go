# Test-coverage thresholds, enforced by `task test:cov` (full unit + integration
# run, needs Docker). go-test-coverage reads the profile below and fails if
# coverage drops under the thresholds.
#
# `threshold.total` is calibrated from a real `task test:cov` run (unit +
# integration with -coverpkg) and set a couple of points below with headroom. Ratchet it UP over time — never lower it to dodge a finding;
# add the missing test instead.
#
# Per-package `override` floors below are the backend's TDD teeth: new
# business logic in a domain package without tests drops that package under its
# floor and fails the gate — it cannot hide in the aggregate total. Add tests in
# the same change and ratchet the floor up. (See .agents/TESTING.md.)
profile: coverage.out

# Generated code and thin entrypoints carry no testable logic of our own.
#
# These paths are MODULE-RELATIVE, exactly like `override.path` below — the tool
# never sees the module prefix. They used to carry one, so NOTHING was actually
# excluded: the total was measured against ~1500 statements of generated
# gqlgen/sqlc code, which is why it read 50.7% while the hand-written code sat
# at 81.5%. Keep both lists in the same form or the exclusion silently no-ops.
exclude:
  paths:
    - ^internal/graph/generated
    - ^internal/graph/model
    - ^internal/db/sqlc
    - ^cmd/

threshold:
  total: 86

# Floors sit 1-3 points under the real numbers of the calibration run (total
# 88.0%, 2026-10-03): the run is shuffled and raced, so a package can move a
# point between runs, and a floor at the exact number would flake. Every package
# with logic of its own has a floor — without one, a package's tests can be
# thinned out and the total barely notices. Raise a floor whenever its package's
# coverage rises; a new package arrives with its floor in the same change.
override:
  - path: ^internal/graph/resolver$
    threshold: 97
  - path: ^internal/graph$
    threshold: 95
  - path: ^internal/middleware$
    threshold: 95
  - path: ^internal/config$
    threshold: 96
  - path: ^internal/i18n$
    threshold: 94
  - path: ^internal/health$
    threshold: 93
  - path: ^internal/app$
    threshold: 87
  - path: ^internal/queue$
    threshold: 87
  - path: ^internal/auth$
    threshold: 84
  - path: ^internal/upload$
    threshold: 83
  - path: ^internal/devtools$
    threshold: 83
  - path: ^internal/db$
    threshold: 75
  - path: ^internal/profile$
    threshold: 75
  - path: ^internal/httperr$
    threshold: 70
  - path: ^internal/server$
    threshold: 60
  - path: ^internal/redis$
    threshold: 57
  # Redaction is the reason a password never reaches a log file; the address
  # check in clientip decides which caller a rate limit applies to. Both are
  # fully covered and must stay that way.
  - path: ^internal/logger$
    threshold: 100
  - path: ^internal/clientip$
    threshold: 100
